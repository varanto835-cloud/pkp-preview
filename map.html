<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magnum Opus - Parkour Progress</title>
  <meta name="description" content="Magnum Opus on Parkour Progress: Rankup, Tier X, unbeaten. Every progress step and who is on it.">
  <meta property="og:title" content="Magnum Opus">
  <meta property="og:description" content="Rankup, Tier X Demon Blade, unbeaten, 18 players on the map">
  <meta property="og:site_name" content="Parkour Progress">
  <meta name="theme-color" content="#ef000b">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <svg class="sprites" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 8 8"><path d="M1 0h4v1h-4zM0 1h1v1h-1zM5 1h1v1h-1zM0 2h1v1h-1zM5 2h1v1h-1zM0 3h1v1h-1zM5 3h1v1h-1zM1 4h4v1h-4zM5 5h2v1h-2zM6 6h2v1h-2z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 8 8"><path d="M0 0h1v1h-1zM0 1h6v1h-6zM0 2h7v1h-7zM0 3h6v1h-6zM0 4h1v1h-1zM0 5h1v1h-1zM0 6h1v1h-1zM0 7h1v1h-1z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 8 8"><path d="M4 0h1v1h-1zM4 1h2v1h-2zM0 2h7v1h-7zM0 3h8v1h-8zM0 4h7v1h-7zM4 5h2v1h-2zM4 6h1v1h-1z"/></symbol>
    <symbol id="i-play" viewBox="0 0 8 8"><path d="M0 0h2v1h-2zM0 1h4v1h-4zM0 2h6v1h-6zM0 3h8v1h-8zM0 4h6v1h-6zM0 5h4v1h-4zM0 6h2v1h-2z"/></symbol>
  </svg>
  <div class="world" style="--world: url('assets/world/magnumopus.jpg')"></div>

  <header class="bar">
    <a class="brand" href="profile.html">Parkour Progress</a>
    <form class="search" role="search" autocomplete="off" onsubmit="return false">
      <label>
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" placeholder="Search players and maps" aria-label="Search players and maps">
      </label>
      <div class="results" role="listbox" hidden></div>
    </form>
    <nav aria-label="Main">
      <button class="button menu" type="button" aria-expanded="false" aria-controls="nav-list">Menu</button>
      <ul id="nav-list">
        <li><a href="map.html" aria-current="page">Maps</a></li>
        <li><a href="profile.html">Players</a></li>
        <li><a href="#">Leaderboards</a></li>
        <li><a href="#">Activity</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero map-hero" aria-label="Map">
      <div class="hero-side" id="side"></div>
    </section>

    <section class="block" aria-labelledby="roles-title">
      <h2 class="win-title" id="roles-title">Badges</h2>
      <ol class="rail" id="roles"></ol>
    </section>

    <div class="split">
      <section class="win" aria-labelledby="route-title">
        <h2 class="win-title" id="route-title">Route</h2>
        <div class="well" id="route"></div>
      </section>
      <aside id="aside"></aside>
    </div>

    <footer class="foot dim">
      <p>Real data from a copy of the ProgressBot database, 2 Oct 2026.</p>
      <p>Mockup: only wlatr and Magnum Opus have pages.</p>
    </footer>
  </main>

  <script src="data/search.js"></script>
  <script src="data/names.js"></script>
  <script src="data/magnum-opus.js"></script>
  <script src="site.js"></script>
  <script src="map.js"></script>
</body>
</html>
