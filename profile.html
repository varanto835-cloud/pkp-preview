<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wlatr - Parkour Progress</title>
  <meta name="description" content="wlatr on Parkour Progress: Tier VIII, TOP 3 in Segmented, 56 victories.">
  <meta property="og:title" content="wlatr">
  <meta property="og:description" content="Tier VIII Sapphire, TOP 3 in Segmented, 56 victories, 8 in progress">
  <meta property="og:site_name" content="Parkour Progress">
  <meta name="theme-color" content="#336aeb">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <svg class="sprites" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 8 8"><path d="M1 0h4v1h-4zM0 1h1v1h-1zM5 1h1v1h-1zM0 2h1v1h-1zM5 2h1v1h-1zM0 3h1v1h-1zM5 3h1v1h-1zM1 4h4v1h-4zM5 5h2v1h-2zM6 6h2v1h-2z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 8 8"><path d="M0 0h1v1h-1zM0 1h6v1h-6zM0 2h7v1h-7zM0 3h6v1h-6zM0 4h1v1h-1zM0 5h1v1h-1zM0 6h1v1h-1zM0 7h1v1h-1z"/></symbol>
    <symbol id="i-check" viewBox="0 0 8 8"><path d="M7 1h1v1h-1zM6 2h2v1h-2zM0 3h1v1h-1zM5 3h2v1h-2zM0 4h2v1h-2zM4 4h2v1h-2zM1 5h4v1h-4zM2 6h2v1h-2z"/></symbol>
    <symbol id="i-crown" viewBox="0 0 8 8"><path d="M0 1h1v1h-1zM3 1h2v1h-2zM7 1h1v1h-1zM0 2h2v1h-2zM3 2h2v1h-2zM6 2h2v1h-2zM0 3h8v1h-8zM0 4h8v1h-8zM1 5h6v1h-6z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 8 8"><path d="M4 0h1v1h-1zM4 1h2v1h-2zM0 2h7v1h-7zM0 3h8v1h-8zM0 4h7v1h-7zM4 5h2v1h-2zM4 6h1v1h-1z"/></symbol>
  </svg>
  <div class="world" style="--world: url('assets/world/jukusection.jpg')"></div>

  <header class="bar">
    <a class="brand" href="profile.html">Parkour Progress</a>
    <form class="search" role="search" autocomplete="off" onsubmit="return false">
      <label>
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" placeholder="Search players and maps" aria-label="Search players and maps">
      </label>
      <div class="results" role="listbox" hidden></div>
    </form>
    <nav aria-label="Main">
      <button class="button menu" type="button" aria-expanded="false" aria-controls="nav-list">Menu</button>
      <ul id="nav-list">
        <li><a href="map.html">Maps</a></li>
        <li><a href="profile.html" aria-current="page">Players</a></li>
        <li><a href="#">Leaderboards</a></li>
        <li><a href="#">Activity</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Player">
      <figure class="held-card" id="card"></figure>
      <div class="hero-side" id="side"></div>
    </section>

    <section class="block" aria-labelledby="progress-title">
      <h2 class="win-title" id="progress-title">In progress</h2>
      <ol class="rail" id="progress"></ol>
    </section>

    <section class="block" aria-labelledby="badges-title">
      <h2 class="win-title" id="badges-title">Badges <small id="badges-count"></small></h2>
      <div class="win">
        <div class="toolbar" id="badges-bar"></div>
        <div class="well collection" id="badges"></div>
      </div>
    </section>

    <footer class="foot dim">
      <p>Real data from a copy of the ProgressBot database, 2 Oct 2026.</p>
      <p>Cards made with Goldy's card generator. Mockup: only wlatr and Magnum Opus have pages.</p>
    </footer>
  </main>

  <script src="data/search.js"></script>
  <script src="data/names.js"></script>
  <script src="data/wlatr.js"></script>
  <script src="data/wlatr-badges.js"></script>
  <script src="site.js"></script>
  <script src="profile.js"></script>
</body>
</html>
